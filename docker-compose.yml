# Production stack: caddy (80/443, auto TLS) -> mcp-server; collector -> postgres.
# Secrets come from .env (never committed). Only caddy publishes ports.
services:
  mcp-server:
    build: { context: ., target: runtime }
    restart: unless-stopped
    env_file: .env
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: flashly
      POSTGRES_USER: flashly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashly -d flashly"]
      interval: 10s
      timeout: 5s
      retries: 5

  collector:
    build: { context: ., target: runtime }
    restart: unless-stopped
    env_file: .env
    environment:
      # POSTGRES_PASSWORD must be URL-safe (use: openssl rand -hex 24)
      DATABASE_URL: postgresql+psycopg://flashly:${POSTGRES_PASSWORD}@postgres:5432/flashly
    command: ["sh", "-c", "alembic upgrade head && python -m flashly.collector"]
    depends_on:
      postgres: { condition: service_healthy }
    security_opt: ["no-new-privileges:true"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      mcp-server: { condition: service_healthy }

volumes:
  pgdata:
  caddy_data:
  caddy_config:
